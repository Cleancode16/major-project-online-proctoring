<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Online Proctoring</title>
    <!-- page background before the CSS bundle loads (keep in sync with --bg in src/index.css) -->
    <style>html { background: #F7F7F5; } html.dark { background: #171717; color-scheme: dark; }</style>
    <script>
      // Apply the saved (or OS) theme before the first paint so dark mode never flashes white.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) { /* storage blocked: stay light */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
